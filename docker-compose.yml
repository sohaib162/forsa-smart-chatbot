services:
  minio:
    image: minio/minio:latest
    container_name: ngbss-minio
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      # ⚠️ PRODUCTION: Change these credentials before deployment!
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SERVER_URL=http://127.0.0.1:9010
      - MINIO_BROWSER_REDIRECT_URL=http://127.0.0.1:9011
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [forsa-net]
    restart: unless-stopped

  retrieval-api:
    build:
      context: ./forsa-endpoints
      dockerfile: Dockerfile
    container_name: ngbss-retrieval-api
    ports:
      - "8000:8000"
    volumes:
      - ./forsa-endpoints/indexes:/app/indexes
      - ./forsa-endpoints/data:/app/data:ro
      - ./forsa-endpoints/config:/app/config:ro
      - ./forsa-endpoints/S3_Storage:/app/S3_Storage
      - ./forsa-endpoints/logs:/app/logs
      - ./forsa-endpoints/docs:/app/docs:ro
    environment:
      - S3_ENDPOINT=minio:9000
      - S3_EXTERNAL_ENDPOINT=localhost:9010
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_SECURE=false
      - S3_BUCKET=forsa-documents
      - FRONTEND_ORIGIN=http://localhost:5173
      - LOG_LEVEL=INFO
    depends_on:
      minio:
        condition: service_healthy
    networks: [forsa-net]
    restart: unless-stopped

  # chatbot-api runs on host machine with GPU (see run-chatbot-local.sh)
  # To run in Docker with GPU, uncomment below and set NVIDIA Container Toolkit:
  # chatbot-api:
  #   build:
  #     context: ./chat-bot-algerie-telecom
  #     dockerfile: Dockerfile
  #   container_name: forsa-chatbot-api
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME:-Qwen/Qwen2.5-3B-Instruct}
  #     - S3_INDEX_PATH=/app/s3_index.json
  #     - ALLOWED_ORIGINS=http://localhost:5173
  #     - LOG_LEVEL=INFO
  #     - PIPELINE_TIMEOUT_SECONDS=120
  #   volumes:
  #     - ./chat-bot-algerie-telecom:/app:Z
  #     - ./forsa-endpoints/S3_Storage/s3_index.json:/app/s3_index.json:ro
  #     - ${HOME}/.cache/huggingface:/root/.cache/huggingface
  #   depends_on: [retrieval-api]
  #   networks: [forsa-net]
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  frontend:
    build:
      context: ./forsa-frontend
      dockerfile: Dockerfile
    container_name: forsa-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_CHAT_API_BASE_URL=http://localhost:8001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./forsa-frontend:/app:Z
      - /app/node_modules
    depends_on: [retrieval-api]
    networks: [forsa-net]
    restart: unless-stopped

networks:
  forsa-net:
    driver: bridge

volumes:
  minio_data:
